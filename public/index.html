<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PeerLive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <button id="exitStreamBtn" class="exit-btn hidden">Exit</button>
    <button id="switchCameraBtn" class="switchcam-btn" style="display:none;">Switch</button>
    
    <div id="welcomeView" class="view">
        <header>
            <h1>PeerLive</h1>
            <p class="tagline">Encrypted peer-to-peer streaming</p>
        </header>

        <div class="modal">
            <div class="form-group">
                <label for="roomId">Room ID</label>
                <input type="text" id="roomId" placeholder="Enter room ID">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>

            <div class="form-group">
                <label for="displayName">Display Name (optional)</label>
                <input type="text" id="displayName" placeholder="Your name" maxlength="32">
            </div>

            <div class="btn-group">
                <button id="createBtn" class="btn">Create Room</button>
                <button id="joinBtn" class="btn">Join Room</button>
            </div>

            <button id="startCameraBtn" class="btn btn-accent" style="display:none;">Start Camera</button>
            <button id="copyUrlBtn" class="btn btn-accent" style="display:none;">Copy Room URL</button>

            <div id="status" class="status"></div>
        </div>

        <button id="goBackBtn" class="btn-back">← Back</button>
    </div>

    <div id="streamView" class="view hidden">
        <div class="stream-layout">
            <div class="video-section">
                <div class="video-stack">
                    <div id="remoteWrapper" class="video-wrapper">
                        <video id="remoteVideo" autoplay playsinline></video>
                    </div>
                    <div id="localWrapper" class="video-wrapper pip">
                        <video id="localVideo" autoplay muted playsinline></video>
                    </div>
                </div>
            </div>

            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Chat</h2>
                </div>

                <div id="chatMessages" class="chat-messages" role="log"></div>

                <div id="chatFileShare" class="file-share" style="display:none;">
                    <input type="file" id="fileInput">
                    <button id="uploadBtn" disabled>Upload</button>
                    <div id="sharedFiles" class="shared-files"></div>
                </div>

                <div class="chat-input-area">
                    <input id="chatInput" class="chat-input" type="text" placeholder="Type a message..." maxlength="500">
                    <button id="chatSendBtn" class="btn-send">Send</button>
                </div>
            </aside>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
